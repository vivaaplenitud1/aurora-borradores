# 1 borrador diario ~10:17 AM hora de Nueva York (DST vía timezone).
# Repo privado: vivaaplenitud1/aurora-borradores
# NUNCA publica: el script solo envía status=draft.
name: articulo-diario

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: America/New_York
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Generar borrador (solo draft)
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          FEATURED_IMAGE_IDS: ${{ secrets.FEATURED_IMAGE_IDS }}
        run: python generar.py

      - name: Commit temas.csv
        run: |
          if git diff --quiet -- temas.csv; then
            echo "Sin cambios en temas.csv"
            exit 0
          fi
          git config user.name "aurora-borradores"
          git config user.email "borradores@users.noreply.github.com"
          git add temas.csv
          git commit -m "chore: tema marcado como borrador"
          git push
